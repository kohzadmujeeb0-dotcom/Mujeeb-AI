        * {

            margin: 0;

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            🤖 Mujeeb <span>AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="side-title">
            RECENT CHATS
        </div>

        <div id="history">
        </div>

        <div class="sidebar-bottom">
            Mujeeb AI<br>
            AI Assistant
        </div>

    </aside>


    <!-- Main -->
    <main class="main">

        <!-- Header -->
        <header class="header">

            <div class="ai-name">
                Mujeeb AI
            </div>

            <div class="online">
                ● Online
            </div>

        </header>


        <!-- Chat -->
        <div class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    🤖
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask me anything
                </p>

            </div>

        </div>


        <!-- Input -->
        <div class="input-area">

            <div class="input-box">

                <input
                    type="text"
                    id="message"
                    placeholder="Message Mujeeb AI..."
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div class="footer-text">
                Mujeeb AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script>

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const history = document.getElementById("history");


    // Send message
    async function sendMessage() {

        const text = input.value.trim();

        if (!text) return;


        // Remove welcome screen
        if (welcome) {
            welcome.remove();
        }


        // User message
        const userRow = document.createElement("div");

        userRow.className = "message-row user-row";

        userRow.innerHTML = `
            <div class="message user-message">
                ${escapeHTML(text)}
            </div>
        `;

        chat.appendChild(userRow);


        // Clear input
        input.value = "";


        // AI thinking
        const aiRow = document.createElement("div");

        aiRow.className = "message-row";

        aiRow.innerHTML = `
            <div class="avatar">🤖</div>

            <div class="message ai-message">
                Mujeeb AI is thinking...
            </div>
        `;

        chat.appendChild(aiRow);


        chat.scrollTop = chat.scrollHeight;


        try {

            const response = await fetch(
                "http://localhost:3000/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


            const data = await response.json();


            if (data.answer) {

                aiRow.querySelector(".ai-message").textContent =
                    data.answer;

            } else {

                aiRow.querySelector(".ai-message").textContent =
                    "Error: " + JSON.stringify(data.error);

            }


        } catch (error) {

            aiRow.querySelector(".ai-message").textContent =
                "Cannot connect to Mujeeb AI server.";

        }


        // Add to recent chats
        addHistory(text);


        chat.scrollTop = chat.scrollHeight;

    }


    // Enter to send
    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    });


    // New chat
    function newChat() {

        chat.innerHTML = `
            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    🤖
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask me anything
                </p>

            </div>
        `;

        input.focus();

    }


    // Recent chat
    function addHistory(text) {

        const item = document.createElement("div");

        item.className = "side-item";

        item.textContent =
            text.length > 25
                ? text.substring(0, 25) + "..."
                : text;

        history.prepend(item);

    }


    // Protect HTML
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
